---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/dashboard":
    get:
      summary: Get dashboard data
      tags:
      - Dashboard
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
  "/api/v1/posts":
    get:
      summary: List posts
      tags:
      - Posts
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: successful
    post:
      summary: Create post
      tags:
      - Posts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                      example: My New Post
                    body:
                      type: string
                      example: This is the content of the post.
                  required:
                  - title
                  - body
  "/api/v1/posts/{id}":
    parameters:
    - name: id
      in: path
      description: Post ID
      required: true
      schema:
        type: string
    get:
      summary: Show post
      tags:
      - Posts
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
    patch:
      summary: Update post
      tags:
      - Posts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                      example: Updated Title
                    body:
                      type: string
                      example: Updated body.
    delete:
      summary: Delete post
      tags:
      - Posts
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
  "/api/v1/users":
    post:
      summary: Register new user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                      example: John
                    last_name:
                      type: string
                      example: Doe
                    email:
                      type: string
                      example: john.doe@example.com
                    password:
                      type: string
                      example: password123
                    password_confirmation:
                      type: string
                      example: password123
                  required:
                  - first_name
                  - last_name
                  - email
                  - password
                  - password_confirmation
  "/api/v1/users/sign_in":
    post:
      summary: Sign in user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@example.com
                    password:
                      type: string
                      example: password123
                  required:
                  - email
                  - password
  "/api/v1/users/sign_out":
    delete:
      summary: Sign out user
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: "{defaultHost}"
  variables:
    defaultHost:
      default: http://localhost:3000
