---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/dashboard":
    get:
      summary: Get dashboard data
      tags:
      - Dashboard
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
  "/api/v1/users":
    post:
      summary: Register new user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '422':
          description: unprocessable entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                      example: John
                    last_name:
                      type: string
                      example: Doe
                    email:
                      type: string
                      example: john.doe@example.com
                    password:
                      type: string
                      example: password123
                    password_confirmation:
                      type: string
                      example: password123
                  required:
                  - first_name
                  - last_name
                  - email
                  - password
                  - password_confirmation
  "/api/v1/users/sign_in":
    post:
      summary: Sign in user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@example.com
                    password:
                      type: string
                      example: password123
                  required:
                  - email
                  - password
  "/api/v1/users/sign_out":
    delete:
      summary: Sign out user
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: "{defaultHost}"
  variables:
    defaultHost:
      default: http://localhost:3000
